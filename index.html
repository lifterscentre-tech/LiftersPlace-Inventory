const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};

async function seedData(){if(S.items.length)return alert('Products are already loaded.');const b=db.batch();let o=0;
 SEED.forEach(([name,price,o0])=>{const r=db.collection('items').doc();b.set(r,{name:name.toUpperCase(),o0,sec:'bar',o:o++,by:U.name});b.set(db.collection('prices').doc(r.id+'_2000-01-01'),{it:r.id,from:'2000-01-01',price,by:U.name})});
 FOODS.forEach(name=>{const r=db.collection('items').doc();b.set(r,{name:name.toUpperCase(),o0:0,sec:'kitchen',o:o++,by:U.name})});await b.commit();toast('Products loaded')}
const rebuildDir=()=>{S.users.forEach(u=>db.collection('directory').doc(u.id).set({name:u.name,role:u.role}));toast('Directory rebuilt')};
async function dedupe(){const seen={},gone=[];S.items.forEach(i=>{const k=(i.sec||'bar')+'|'+i.name.trim().toUpperCase();if(seen[k])gone.push(i.id);else seen[k]=1});if(!gone.length)return alert('No duplicates found.');if(!confirm(gone.length+' duplicate items will be removed.')||!await pwOk())return;
 const b=db.batch();gone.forEach(id=>b.delete(db.collection('items').doc(id)));S.prices.filter(x=>gone.includes(x.it)).forEach(x=>b.delete(db.collection('prices').doc(x.id)));await b.commit();log('Removed '+gone.length+' duplicate items');toast('Duplicates removed')}
async function addUser(e){const f=fd(e),em=f.email.trim().toLowerCase();try{if(f.password){const a2=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(FB_CONFIG,'sec');try{await a2.auth().createUserWithEmailAndPassword(em,f.password)}catch(x){if(x.code!='auth/email-already-in-use')throw x}await a2.auth().signOut()}
 await db.collection('users').doc(em).set({name:f.name,role:f.role,active:true});await db.collection('directory').doc(em).set({name:f.name,role:f.role});log('Added user '+f.name+' ('+f.role+')');toast('User saved');e.target.reset()}catch(x){alert(x.message)}}
const setRole=(id,r)=>{db.collection('users').doc(id).update({role:r});db.collection('directory').doc(id).set({name:(S.users.find(u=>u.id==id)||{}).name||id,role:r});log('Role of '+id+' → '+r)};
async function resetPw(id){try{await auth.sendPasswordResetEmail(id);alert('Reset link sent to '+id)}catch(x){alert(x.message)}}
async function toggleU(id){const u=S.users.find(x=>x.id==id);if(await pwOk()){db.collection('users').doc(id).update({active:u.active===false});log((u.active===false?'Activated ':'Deactivated ')+id)}}
const grant=id=>{db.doc('grants/'+id).set({until:firebase.firestore.Timestamp.fromMillis(Date.now()+864e5),by:U.name});log('Granted 24h audit access to '+id);toast('Access granted for 24 hours')},revoke=id=>{db.doc('grants/'+id).delete();log('Revoked audit access of '+id)};
const saveCid=e=>{const f=fd(e);db.doc('settings/main').set({clientId:f.cid.trim()},{merge:true});toast('Client ID saved')};
const addAcc=e=>{const f=fd(e);db.doc('settings/main').set({driveAccounts:firebase.firestore.FieldValue.arrayUnion(f.em.trim().toLowerCase())},{merge:true});e.target.reset()};
const rmAcc=a=>db.doc('settings/main').set({driveAccounts:firebase.firestore.FieldValue.arrayRemove(a)},{merge:true});
/* ---- sync and Google Drive backup ---- */
async function sync(){toast('Syncing…');try{await Promise.race([Promise.all([db.enableNetwork(),db.waitForPendingWrites(),db.doc('settings/main').get({source:'server'})]),new Promise((_,r)=>setTimeout(r,8000))]);S.sync=new Date();toast('Synced ✓ '+S.sync.toLocaleTimeString()+(seeAll()&&reconIssues()?' · '+reconIssues()+' reconciliation issue(s)':''));autoBackup()}catch{toast('Offline – changes will sync automatically')}render(1)}
const SC='https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const tok=(hint,silent)=>new Promise((ok,no)=>{const id=S.cfg.clientId;if(!id||!window.google?.accounts)return no('setup');google.accounts.oauth2.initTokenClient({client_id:id,scope:SC,hint,prompt:silent?'none':'',callback:r=>r.access_token?ok(r.access_token):no(r.error),error_callback:e=>no(e.type)}).requestAccessToken()});
async function bfiles(){const all={items:S.items,prices:S.prices,moves:S.moves,pay:S.pay,rcpt:S.rcpt,bank:S.bank},j=v=>JSON.parse(JSON.stringify(v,(k,x)=>x&&x.seconds?new Date(x.seconds*1e3).toISOString():x)),out=[{name:`lifters_backup_${tdy()}.json`,blob:new Blob([JSON.stringify(j(all))],{type:'application/json'})}];
 if(window.XLSX){const wb=XLSX.utils.book_new();for(const k in all)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(j(all[k])),k);out.push({name:`lifters_backup_${tdy()}.xlsx`,blob:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})])})}return out}
async function upDrive(t,f){const H={Authorization:'Bearer '+t},l=await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent(`name='${f.name}' and trashed=false`),{headers:H}).then(r=>r.json()),id=l.files&&l.files[0]?.id;let r;
 if(id)r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:H,body:f.blob});
 else{const m=new FormData();m.append('metadata',new Blob([JSON.stringify({name:f.name})],{type:'application/json'}));m.append('file',f.blob);r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:H,body:m})}if(!r.ok)throw 0}
async function backup(manual){const acc=S.cfg.driveAccounts||[];if(!S.cfg.clientId||!acc.length){if(manual)toast('Backup is not set up yet – ask the Admin');return}
 if(!navigator.onLine){localStorage.bkpend=1;if(manual)toast('Offline – backup will run later');return}
 const fl=await bfiles();let ok=0;for(const e of acc){try{const t=await tok(e,!manual);for(const f of fl)await upDrive(t,f);ok++}catch{}}
 if(ok){localStorage.lastbk=new Date().toLocaleString();localStorage.removeItem('bkpend')}else localStorage.bkpend=1;if(manual)toast(`Backed up to ${ok} of ${acc.length} account(s)`);render(1)}
let bkT;const autoBackup=()=>{clearTimeout(bkT);bkT=setTimeout(()=>backup(false),3000)};
/* ---- shell ---- */
function render(soft){const A=$('#app');if(soft&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')&&A.contains(document.activeElement))return;
 if(!U){A.innerHTML=NP?(NP.first?`<div class=c><img src=logo.png alt=""><h3>Set up the Admin</h3><p>You are signed in as ${esc(NP.email)}. Enter your name to make this the Admin account.</p><input id=cn placeholder="Your full name"><button class=btn onclick="claim()">Create Admin profile</button><button class="btn l" onclick="out()">Sign out</button></div>`:`<div class=c><img src=logo.png alt=""><h3>No access yet</h3><p>${esc(NP.email)} has no role. Ask the Admin to add your email.</p><button class="btn l" onclick="auth.signOut()">Sign out</button></div>`)
  :`<form class=c onsubmit="login(event)"><img src=logo.png alt="Lifter’s"><h3>Sign in</h3><input id=le type=email placeholder="Email" autocomplete=username required><input id=lp type=password placeholder="Password" autocomplete=current-password required>${bad?`<p class=bad>${esc(bad)}</p>`:''}<button id=lb class=btn>Sign in</button><button type=button class="btn l" onclick="forgot()">Forgot password?</button></form>`;return}
 if(L){A.innerHTML=`<form class=c onsubmit="unlock(event)"><h3>Locked</h3><input id=lp type=password inputmode=numeric placeholder="PIN" required><button class=btn>Unlock</button></form>`;return}
 if(!tabs().includes(tab))tab='home';
 A.innerHTML=`<header><div class=brand><img src=icon-192.png alt=""><div><b>Lifter’s Apartments Inventory</b><small>${esc(U.name)} · ${U.role.replace('_',' ')}</small></div></div><div><button class="btn l" onclick="lockNow()">🔒</button> <button class="btn l" onclick="account()">Password</button> <button class="btn l" onclick="auth.signOut()">Sign out</button></div></header>
 <nav>${tabs().map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${lbl(t)}</button>`).join('')}</nav><main>${V[tab]()}${notes()}</main>
 <footer><button class="btn g" onclick="saveAct()">💾 Save</button><button class="btn l" onclick="sync()">⟳ Sync</button><button class="btn l" onclick="backup(true)">☁ Back up</button><span class="pill ${navigator.onLine&&!dirty()?'':'x'}">${!navigator.onLine?'Offline':dirty()?'Order not saved yet':'Synced '+(S.sync?S.sync.toLocaleTimeString():'')}</span></footer>`}
addEventListener('online',()=>{render();sync()});addEventListener('offline',render);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
render();

</script></body></html>
