async function shrink(file){if(!file.type.startsWith('image/'))return file;const bm=await createImageBitmap(file),k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 let q=.7,b;do{b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.15}while(b.size>6e5&&q>.2);return b}
async function up(file){const b=await shrink(file);if(b.size>65e4){alert('This file is too big (limit about 650 KB). Take a photo of it instead, or compress the PDF.');throw new Error('size')}
 const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});return 'f:'+(await db.collection('files').add(stamp({data,name:file.name,type:b.type||file.type}))).id}

function exp(kind){const[a,b]=span(),head=['S/N','PRODUCT','OPENING','NEW','CLOSING','SOLD','PRICE','AMOUNT'];let body=[];

const pd=v=>{if(v instanceof Date)return new Date(+v+432e5).toISOString().slice(0,10);if(typeof v=='string'){let m=v.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=v.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return`${m[3]}-${p(m[2])}-${p(m[1])}`}return null};
async function impBank(f){if(!f)return;if(!window.XLSX)return alert('Open once online to load the spreadsheet reader');
 const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),ws=wb.Sheets[wb.SheetNames.find(n=>/bank/i.test(n))||wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true}),out=[];let d=null;
 for(const r of rows){if(r.some(c=>typeof c=='string'&&/^\s*cash\s*$/i.test(c)))break;let x=null;for(const c of r.slice(0,4)){const q=pd(c);if(q)d=q}
  for(let i=Math.min(r.length-1,3);i>=1;i--)if(typeof r[i]=='number'){x=r[i];break}if(x>0&&d)out.push({date:d,amt:x})}
 if(out.length>1&&out.at(-1).amt==sum(out.slice(0,-1),x=>x.amt))out.pop();if(!out.length)return alert('No credits found');
 const ds=out.map(x=>x.date).sort(),b=db.batch();S.bank.filter(x=>inR(x.date,ds[0],ds.at(-1))).forEach(x=>b.delete(db.collection('bank').doc(x.id)));out.forEach(x=>b.set(db.collection('bank').doc(),stamp(x)));await b.commit();log('Bank statement '+ds[0]+' to '+ds.at(-1));alert(`Imported ${out.length} credits`)}

function waOpen(phone,t){let n=String(phone).replace(/\D/g,'');if(n.startsWith('0'))n='234'+n.slice(1);open(`https://wa.me/${n}?text=${encodeURIComponent(t)}`)}

async function wa(id){const x=S.lodg.find(l=>l.id==id),k=await pick('Message to send on WhatsApp',Object.keys(TPL));if(k)waOpen(x.phone,TPL[k](x))}
function hrLock(){return U.role=='hr'?S.dir.filter(x=>x.role=='auditor').map(x=>`<div class=card>🔒 <b>${esc(x.name)}</b> <span class=pill>auditor</span> <small>Panel locked – view only. Message the Auditor from Discussion.</small></div>`).join(''):''}
async function addOrder(e){const f=fd(e),x=S.lodg.find(l=>l.id==f.lodg),it=S.items.find(i=>i.id==f.item),q=+f.qty||1;if(!x||!it)return;const pr=priceAt(it.id,tdy());
 if(!pr&&!confirm('This item has no price yet. Send anyway?'))return;await db.collection('orders').add(stamp({lodgId:x.id,lodgName:x.name,unit:x.unit,kind:(it.sec||'bar')=='kitchen'?'kitchen':'drinks',item:it.name,itemId:it.id,qty:q,amt:pr*q,note:f.note,status:'new'}));log('Request '+it.name+' for '+x.name)}
const serve=id=>db.collection('orders').doc(id).update({status:'served',servedBy:U.name});
function lNote(id){const d=$('#dlg');d.innerHTML=`<form id=nf method=dialog><p>Note about this lodger</p><textarea name=t required></textarea><input type=file name=f accept="image/*"><div class=bar><button class=btn value=ok>Save</button><button value=x formnovalidate>Cancel</button></div></form>`;
 d.onclose=async()=>{if(d.returnValue!='ok')return;const f=$('#nf'),fl=f.f.files[0],n={t:f.t.value,by:U.name,at:tdy(),path:fl?await up(fl,'notes'):''};await db.collection('lodg').doc(id).update({notes:firebase.firestore.FieldValue.arrayUnion(n)})};d.showModal()}
async function addAppr(e){const f=fd(e),sc=[0,1,2,3,4,5].map(i=>+f['s'+i]);await db.collection('appraisals').add(stamp({staffId:f.staff,name:dispName(f.staff),period:f.period,scores:sc,avg:sum(sc,x=>x)/6,strengths:f.strengths,improve:f.improve,goals:f.goals,rec:f.rec}));log('Appraisal for '+dispName(f.staff));e.target.reset()}
const SC='https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const tok=hint=>new Promise((ok,no)=>{if(!window.google||!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID=='PASTE'){alert('Google sign-in is not set up yet (see README).');return no()}google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SC,hint,prompt:hint?'':'select_account',callback:r=>r.access_token?ok(r.access_token):no(r)}).requestAccessToken()});
async function addDrive(){try{const t=await tok(),u=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json());await db.doc('settings/drive').set({accounts:firebase.firestore.FieldValue.arrayUnion(u.email)},{merge:true});log('Drive account added '+u.email)}catch{}}
async function rmDrive(e){if(await pwOk()){await db.doc('settings/drive').update({accounts:firebase.firestore.FieldValue.arrayRemove(e)});log('Drive account removed '+e)}}
async function bfiles(){const all={items:S.items,prices:S.prices,stock:Object.values(S.stock).flatMap(o=>Object.values(o)),pay:S.pay,rcpt:S.rcpt,bank:S.bank,lodg:S.lodg,orders:S.orders,appraisals:S.appr},out=[{name:`lifters_backup_${tdy()}.json`,blob:new Blob([JSON.stringify(all)],{type:'application/json'})}];
 if(window.XLSX){const wb=XLSX.utils.book_new();for(const k in all)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(all[k].map(r=>JSON.parse(JSON.stringify(r,(a,v)=>v&&v.seconds?new Date(v.seconds*1e3).toISOString():v)))),k.slice(0,30));out.push({name:`lifters_backup_${tdy()}.xlsx`,blob:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})])})}return out}
async function backupAll(){const a=S.drive.accounts||[];if(!a.length)return alert('Add a Google account first');const fl=await bfiles();let ok=0;
 for(const e of a){try{const t=await tok(e);for(const f of fl){const fm=new FormData();fm.append('metadata',new Blob([JSON.stringify({name:f.name})],{type:'application/json'}));fm.append('file',f.blob);const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+t},body:fm});if(!r.ok)throw 0}ok++}catch{alert('Backup failed for '+e)}}
 await db.doc('settings/drive').set({last:new Date().toLocaleString()},{merge:true});log(`Drive backup ${ok}/${a.length}`);alert(`Backed up to ${ok} of ${a.length} accounts`)}
async function readPdf(file){try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let t='';
 for(let i=1;i<=Math.min(pdf.numPages,3);i++)t+=' '+(await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ');const num='(?:₦|NGN|N)?\\s?(\\d{1,3}(?:,\\d{3})+(?:\\.\\d{1,2})?|\\d+(?:\\.\\d{1,2})?)',k=t.match(new RegExp('(?:amount|total|debit)[^\\d₦]{0,25}'+num,'i'));
 if(k)return +k[1].replace(/,/g,'');const v=[...t.matchAll(/(?:₦|NGN)\s?(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?)/g)].map(m=>+m[1].replace(/,/g,''));return v.length?Math.max(...v):null}catch{return null}}
async function fillAmt(i){const f=i.files[0];if(f&&/pdf/i.test(f.type)){const v=await readPdf(f);if(v){i.form.amt.value=v;alert('Amount read from the PDF: '+M(v)+'. Please check it before saving.')}else alert('Could not read an amount from this PDF. Please type it.')}}
const ACC=[['Admin','Admin','admin'],['Auditor101','Auditor','auditor'],['Manager','Manager','manager'],['Reception1','Receptionist 1','receptionist'],['Reception2','Receptionist 2','receptionist'],['Kitchen101','Kitchen','kitchen'],['HumanResource','Human Resource','hr'],['ManagingDirector','Managing Director','md']];let SETUP=false;
function first(){const d=$('#dlg');d.innerHTML=`<form id=sf method=dialog><p><b>First-time setup</b><br>Choose a password for each account (6+ characters). Do this yourself, right after publishing the app.</p>${ACC.map(([u,n])=>`<input name="${u}" type=password placeholder="${n} password" minlength=6 required>`).join('')}<div class=bar><button class=btn value=ok>Create accounts</button><button value=x formnovalidate>Cancel</button></div></form>`;
 d.onclose=async()=>{if(d.returnValue!='ok')return;const f=Object.fromEntries(new FormData($('#sf')));SETUP=true;try{const e=mail('Admin'),c=await auth.createUserWithEmailAndPassword(e,f.Admin),b=db.batch();
  b.set(db.doc('meta/setup'),{at:TS()});b.set(db.doc('users/'+c.user.uid),{name:'Admin',username:'Admin',email:e,role:'admin',caps:[],active:true});b.set(db.doc('directory/'+c.user.uid),{name:'Admin',role:'admin'});await b.commit();
  for(const [u,n,r] of ACC.slice(1))await mkUser({name:n,username:u,password:f[u],role:r});alert('Done. Sign in as Admin.')}catch(x){alert('Setup stopped: '+x.message+'. If Admin already exists, sign in instead.')}SETUP=false;await auth.signOut()};d.showModal()}

/* ---- account, lock, shell ---- */
async function account(){const v=await ask('Change password: type your NEW password (6+)','password');if(!v)return;if(!await pwOk())return;try{await auth.currentUser.updatePassword(v);alert('Password changed')}catch(e){alert(e.message)}}
async function setLock(){const v=await ask('Set an app-lock PIN for this device (empty to remove)');if(v===null)return;if(v)localStorage.lockpin=hp(v);else localStorage.removeItem('lockpin');alert(v?'App lock on (also locks after 3 minutes idle)':'App lock removed')}
const lockNow=()=>{if(!localStorage.lockpin)return setLock();L=true;render()};let idle;const bump=()=>{clearTimeout(idle);if(localStorage.lockpin&&U)idle=setTimeout(()=>{L=true;render()},18e4)};['click','keydown','touchstart'].forEach(k=>addEventListener(k,bump));
function unlock(e){e.preventDefault();if(hp($('#lp').value)==localStorage.lockpin){L=false;render();bump()}else alert('Wrong PIN')}
function mail(u){return u.includes('@')?u:u.trim().toLowerCase().replace(/\s+/g,'')+'@lifters.app'}
async function login(e){e.preventDefault();try{await auth.signInWithEmailAndPassword(mail($('#lu').value),$('#lp').value)}catch(x){alert('Sign-in failed: check username/email and password')}}
const forgot=async()=>{const u=$('#lu').value;if(!u.includes('@'))return alert('Type your real email above first. Username-only accounts: ask Admin/Auditor to set a new password.');auth.sendPasswordResetEmail(u).then(()=>alert('Reset email sent'))};
function render(soft){const A=$('#app');if(soft&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')&&A.contains(document.activeElement))return;
 if(!U){A.innerHTML=`<form class=c onsubmit="login(event)"><img src=logo.png style="width:100%;max-width:260px;height:auto" alt="Lifter’s"><h2>Lifter’s Apartments Inventory</h2><input id=lu placeholder="Username or email" autocomplete=username required><input id=lp type=password placeholder=Password autocomplete=current-password required><button class=btn>Sign in</button><button type=button class="btn l" onclick="forgot()">Forgot password</button><small><a href=# onclick="first();return false">First-time setup</a></small></form>`;return}
 if(L){A.innerHTML=`<form class=c onsubmit="unlock(event)"><h2>Locked</h2><input id=lp type=password inputmode=numeric placeholder="PIN" required><button class=btn>Unlock</button></form>`;return}
 const ts=tabs();A.innerHTML=`<header><div style="display:flex;gap:8px;align-items:center"><img src=icon-192.png width=36 height=36 alt="" style="background:#fff;border-radius:8px"><div><b>Lifter’s Apartments Inventory</b><small>${esc(U.name)} · ${U.role} · ${navigator.onLine?'online':'offline (will sync)'}</small></div></div><div><button class="btn l" onclick="lockNow()">Lock</button> <button class="btn l" onclick="account()">Password</button> <button class="btn l" onclick="auth.signOut()">Out</button></div></header><nav>${ts.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';render()">${LBL[t]}</button>`).join('')}</nav><main>${V[tab]()}</main>`}
addEventListener('online',render);addEventListener('offline',render);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
render();
